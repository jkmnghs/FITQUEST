<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no blocked pinch-zoom entirely, which fails WCAG 1.4.4 and
         makes the set-logging grid unusable for anyone who needs to magnify it.
         maximum-scale=5 keeps zoom available without letting a stray double-tap
         throw the layout off. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitQuest" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="description" content="Your AI-powered 12-week training companion. Track workouts, get personalized coaching, and level up your fitness." />
    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FitQuest — AI-Powered Fitness Training" />
    <meta property="og:description" content="Your AI-powered 12-week training companion. Track workouts, get personalized coaching, and level up your fitness." />
    <meta property="og:image" content="/apple-touch-icon-v2.png" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FitQuest — AI-Powered Fitness Training" />
    <meta name="twitter:description" content="Your AI-powered 12-week training companion. Track workouts, get personalized coaching, and level up your fitness." />
    <meta name="twitter:image" content="/apple-touch-icon-v2.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Two families only. Rajdhani was dropped: it duplicated Inter's role
         rather than adding a level to the hierarchy.
         Weight ranges rather than a fixed list — the UI uses 600 and 800, which
         the old `wght@400;700;900` request did not include, so the browser was
         synthesising them. -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Inter:wght@400..700&display=swap" rel="stylesheet" />
    <title>FitQuest — AI-Powered Fitness Training</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
